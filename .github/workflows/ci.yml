name: CI

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and expect
        run: sudo apt-get update && sudo apt-get install -y shellcheck expect

      - name: Run shellcheck
        run: |
          files=$(git ls-files | grep -E '\.sh$|\.bash$|^bin/(crouter|crouter-compat)$|^\.githooks/')
          if [ -n "$files" ]; then
            # SC1007:  CDPATH= cd / VAR= VAR2= one-liner resets are intentional POSIX idioms
            # SC1090/SC1091: providers and config are sourced at runtime (dynamic paths)
            # SC2034: provider vars are read by the launcher after sourcing, not in-file
            # SC2120: resolve_surface_tokens(1) is called from bin/crouter after sourcing lib/auth.sh
            # shellcheck disable=SC2086
            shellcheck --severity=warning --exclude=SC1007,SC1090,SC1091,SC2034,SC2120 $files
          else
            echo "No shell scripts found to check."
          fi

      - name: Check Node syntax
        run: |
          for file in bin/gateway bin/keypool-proxy lib/*.js lib/*.mjs; do
            node --check "$file"
          done

      - name: Run all offline tests with sh and dash
        run: |
          for shell in sh dash; do
            for test_file in test/*.sh; do
              printf 'running %s %s\n' "$shell" "$test_file"
              TEST_SHELL="$shell" "$shell" "$test_file"
            done
          done

      - name: Verify release metadata
        run: |
          version=$(cat VERSION)
          test "$(./bin/crouter --version)" = "crouter $version"
          grep -F "version-$version-blue" README.md
          grep -F "## [$version]" CHANGELOG.md
